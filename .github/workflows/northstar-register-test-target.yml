name: Register Northstar test target

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: family-tree-api
    timeout-minutes: 5
    env:
      PROD_ENV: ${{ secrets.PROD_ENV }}
      NORTHSTAR_SETUP_URL: ${{ secrets.NORTHSTAR_SETUP_URL }}
      NORTHSTAR_SETUP_TOKEN: ${{ secrets.NORTHSTAR_SETUP_TOKEN }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Register the existing database without printing credentials
        shell: bash
        run: |
          node <<'JS'
          const values = {};
          for (const raw of process.env.PROD_ENV.split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith("#") || !line.includes("=")) continue;
            const split = line.indexOf("=");
            let value = line.slice(split + 1).trim();
            if (value.length >= 2 && value[0] === value[value.length - 1] && ["\"", "'"].includes(value[0])) {
              value = value.slice(1, -1);
            }
            values[line.slice(0, split).trim()] = value;
          }

          const password = values.DB_PASSWORD || "";
          console.log("::add-mask::" + password);
          const required = ["DB_HOST", "DB_NAME", "DB_USER", "DB_PASSWORD"];
          const missing = required.filter((key) => !values[key]);
          if (missing.length) throw new Error("PROD_ENV is missing: " + missing.join(", "));

          const database = encodeURIComponent(values.DB_NAME);
          const username = encodeURIComponent(values.DB_USER);
          const encodedPassword = encodeURIComponent(password);
          const port = values.DB_PORT || "5432";
          const databaseUrl = `postgresql://${username}:${encodedPassword}@${values.DB_HOST}:${port}/${database}?sslmode=require`;
          const response = await fetch(process.env.NORTHSTAR_SETUP_URL, {
            method: "POST",
            headers: {
              authorization: "Bearer " + process.env.NORTHSTAR_SETUP_TOKEN,
              "content-type": "application/json",
            },
            body: JSON.stringify({ database_url: databaseUrl }),
          });
          if (!response.ok) throw new Error(`Northstar setup returned HTTP ${response.status}: ${await response.text()}`);
          const result = await response.json();
          console.log("Registered Northstar target " + result.id);
          JS
